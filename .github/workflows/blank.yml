name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "ExpressiveFiles-v$VERSION.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveFiles-v${{ env.VERSION }}
          path: ExpressiveFiles-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Expressive Files ${{ env.VERSION }}
          body_path: RELEASE_NOTES_${{ env.VERSION }}.md
          files: ExpressiveFiles-v${{ env.VERSION }}.apk
          fail_on_unmatched_files: true

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
